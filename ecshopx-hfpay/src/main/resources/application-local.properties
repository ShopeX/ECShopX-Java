# Local defaults for hfpay file upload (override in deployment).
ecshopx.hfpay.storage-root=${user.home}/ecshopx-storage
# Optional: absolute path to cfcalog.conf when validating file presence before sign/decrypt; leave empty if unused.
ecshopx.hfpay.cfcalog-config=
# Background notify URL for Huifu acou APIs; set to your deployment callback endpoint.
ecshopx.hfpay.bg-ret-url=https://example.com/hfpay/notify
# Public base URL for import-image files (no trailing slash); used to build absolute *_full_url fields.
ecshopx.filesystem.import-image-public-base=https://example.com/storage/import-image
