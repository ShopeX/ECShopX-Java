# OpenAPI / springdoc Swagger UI（本地或联调启用）
# 激活方式其一：spring.config.import 增加 optional:classpath:application-openapi-docs.yml
# 激活方式其二：启动参数覆盖 springdoc.*.enabled=true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  # Boot 3.5 / Framework 6.2：避免扫 ControllerAdvice 时踩兼容问题
  override-with-generic-response: false
