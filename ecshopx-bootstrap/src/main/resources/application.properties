ecshopx.wechat.open.component-verify-ticket=

# 小程序订阅消息「从模板库选用」管理端 HTTP（addtemplate/deltemplate）。默认 false，使用空实现；生产需调微信时改为 true。
ecshopx.wechat.wxa.subscribe-template.http-enabled=false

# 小程序上架 / 提审流程（布尔默认值与历史 wechat 配置一致）
ecshopx.wechat.wxa-publish.is-automatic-submit-review=true
ecshopx.wechat.wxa-publish.open-third=true
ecshopx.wechat.wxa-publish.wxa-need-open-platform=true
# 当 superadmin_wxapp_template 无启用行时，按顺序加载下列 key 的 wxa-template-fallback.* 配置（多模板回退）
ecshopx.wechat.wxa-template-list-fallback-keys=yykweishop
# 模板元数据：DB 未命中时的扁平回退键（ecshopx.wechat.wxa-template-fallback.<key>.*）
