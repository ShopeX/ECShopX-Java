ecshopx.wechat.live-player-plugin.provider=wxlive

# 微信支付 v2 统一下单异步通知完整 URL（需公网可达；默认仅本地占位）
ecshopx.payment.wechat.notify-url=http://127.0.0.1/wechatAuth/wxpay/notify
ecshopx.payment.alipay.notify-url=http://localhost:8080/api/v1/alipay/notify
ecshopx.payment.hfpay-is-open=${HFPAY_IS_OPEN:false}

# 斗门国际收银台（汇付）：base/notify 对应 DOUMEN_INTL_*；Java 环境 notify_url 指向本服务
ecshopx.payment.doumen-intl.base-url=${DOUMEN_INTL_BASE_URL:}
ecshopx.payment.doumen-intl.notify-url=${DOUMEN_INTL_NOTIFY_URL:}
ecshopx.payment.doumen-intl.sandbox=${DOUMEN_INTL_SANDBOX:true}
ecshopx.payment.doumen-intl.token-refresh-interval-minutes=${DOUMEN_INTL_TOKEN_REFRESH_INTERVAL_MINUTES:115}

# 银联商务异步通知验签密钥（对应 ums.Md5Key；网关回调报文使用 SHA256 十六进制大写签名）
