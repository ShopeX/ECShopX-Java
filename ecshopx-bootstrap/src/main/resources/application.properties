spring.application.name=ecshopx
server.port=18080

# --- XXL-JOB executor（阶段 0 基建；admin 独立部署，见 docs/migration/infra/xxl-job/README.md）---
xxl.job.admin.addresses=http://127.0.0.1:9080/xxl-job-admin
xxl.job.accessToken=ecshopx-cron-dev
xxl.job.executor.appname=ecshopx-executor
xxl.job.executor.address=
xxl.job.executor.ip=
xxl.job.executor.port=19999
xxl.job.executor.logpath=logs/xxl-job
xxl.job.executor.logretentiondays=7
# Undertow is the embedded server (bootstrap module); server.tomcat.* is ignored.
# Allow raw UTF-8 (and other unescaped) bytes in query string; matches io.undertow.UndertowOptions.ALLOW_UNESCAPED_CHARACTERS_IN_URL.
server.undertow.options.server.allow-unescaped-characters-in-url=true
# Total HTTP POST body cap; keep above spring.servlet.multipart.* so large multipart reaches Spring / business validation.
server.undertow.max-http-post-size=64MB

# Match collection URLs with or without a trailing slash (same handler as no-slash path).
spring.mvc.servlet.pathmatch.use-trailing-slash-match=true

# --- DataSource ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ecshopx?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=ecshopx
spring.datasource.password=ecshopx
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Flyway ---
# Install / Docker stacks rely on startup migrate (baselineOnMigrate for existing ecshopx.sql DBs).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.encoding=UTF-8

# --- MyBatis-Plus ---
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# --- Redis (default + companys + prism logical DB) ---
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=redispassword
spring.data.redis.database=0
# Custom MultiRedisConfig Lettuce factories (not Boot auto-config): avoid idle Docker Connection reset
ecshopx.redis.lettuce.command-timeout=5s
ecshopx.redis.lettuce.connect-timeout=10s
ecshopx.redis.lettuce.validate-connection=true
ecshopx.redis.companys.database=0
ecshopx.redis.prism.database=2
# Datacube Redis logical database index; override per environment when using a non-default DB
ecshopx.redis.datacube.database=0
# Deposit Redis logical database; day recharge totals e.g. dayRechargeTotal{yyyy-MM-dd}
ecshopx.redis.deposit.database=1
# Wechat-named Redis logical DB (align deployment with the wechat connection index when not using default)
# ecshopx.redis.wechat.database=

# --- Admin operator login / JWT ---
ADMIN_LOGIN_CHECK_LEVEL=
# Standard Base64 of a 32-byte key (openssl rand -base64 32). Required for H5 JWT strict decode.
JWT_SECRET=
JWT_TTL=120
# 运营端 JWT 刷新允许窗口（分钟），自 iat 起算；默认 20160
JWT_REFRESH_TTL=20160
ecshopx.h5.jwt.secret-base64=${JWT_SECRET}
ecshopx.h5.jwt.ttl-minutes=${JWT_TTL:120}
ecshopx.h5.jwt.refresh-ttl-minutes=${JWT_REFRESH_TTL:20160}
ecshopx.h5.jwt.blacklist-grace-period-seconds=${JWT_BLACKLIST_GRACE_PERIOD:0}

# H5 / 小程序商户入驻 JWT（merchant API 语义）；issuer 可与 H5 共用，生产环境按需覆盖
ecshopx.merchant.wxapp.jwt.issuer=ecshopx
ecshopx.merchant.wxapp.jwt.secret-base64=${JWT_SECRET}
ecshopx.merchant.wxapp.jwt.ttl-minutes=60
common.encrypt-sensitive-data=false
# PHP Laravel 兼容的邮件配置密码编解码（对齐 ecshopx-api-open/.env 的 APP_KEY + AES-256-CBC；raw key，非 base64）
ecshopx.mail.password.app-key=
ecshopx.mail.password.cipher=AES-256-CBC
common.sms-send-limit=5
common.system-is-saas=false
common.system-companys-id=1
# Comma-separated company_id list for demo tenants; forces sensitive-data masking on AdaPay open-account step (aligns with legacy demo_company_id).
ecshopx.common.demo-company-ids=
# Static API token for selected HTTP endpoints that validate a query `token`; must match deployment secrets; may stay empty in repo for ops injection
ecshopx.common.api-token=
# Main tenant id when SaaS (optional); leave empty if unused
common.system-main-companys-id=
common.product-model=platform
# H5 基址（对标运营侧 common.h5_base_url），用于激活信息中的 h5_url；可通过环境变量覆盖，例如 COMMON_H5_BASE_URL
common.h5-base-url=${COMMON_H5_BASE_URL:}
# API 基址（拼 Apple OAuth redirect_uri）；默认 APP_URL + /api/v1
common.api-base-url=${COMMON_API_BASE_URL:${API_BASE_URL:}}
# 同城配承运：dada | shansong（与历史 common.local_delivery_dirver 配置项一致）
common.local-delivery-dirver=${LOCAL_DELIVERY_DIRVER:dada}
common.system-open-online=false
common.use-system-menu=true
ecshopx.is-dev-mode=false
ecshopx.companys.pharma-industry-setting-ttl-seconds=0

#  ecshopx.h5.local.* 沿用 common.*
ecshopx.h5.local.system-is-saas=${common.system-is-saas:false}
ecshopx.h5.local.system-companys-id=${common.system-companys-id:1}
ecshopx.h5.local.system-main-companys-id=${common.system-main-companys-id:}

# SMS scene name whitelist by product model（与部署侧短信配置中的顶层键对应）
ecshopx.sms.b2c=
ecshopx.sms.platform=
ecshopx.sms.standard=
ecshopx.sms.in-purchase[0]=注册验证码
ecshopx.sms.in-purchase[1]=找回密码验证码
ecshopx.sms.in-purchase[2]=手机号登录验证码
ecshopx.sms.in-purchase[3]=手机号修改验证码
ecshopx.sms.in-purchase[4]=微信支付成功通知

# Operator App SMS — Shopex gateway；企业字段留空时可走公司短信通道
ecshopx.operator.sms.shopex.api-url=http://api.sms.shopex.cn
ecshopx.operator.sms.shopex.ent-id=
ecshopx.operator.sms.shopex.ent-pwd=
ecshopx.operator.sms.shopex.license=
ecshopx.operator.sms.shopex.source=
ecshopx.operator.sms.shopex.secret=

# Amap trajectory/track API (店铺围栏等)
ecshopx.map.amap.track-base-uri=https://tsapi.amap.com
ecshopx.map.amap.app-key=
ecshopx.map.amap.app-secret=

# --- Import module configs ---
# spring.config.import=optional:classpath:application-aftersales.yml
spring.config.import=optional:classpath:application-request-field.yml,optional:classpath:application-bspay.yml,optional:classpath:application-shuyun.yml,optional:classpath:application-members.yml

# Shopex user center (agreement fetch); must be defined for bootstrap Environment (library jar application.properties is not auto-merged)
espier.shopex-usercenter.base-uri=https://www.shopex.cn
espier.shopex-usercenter.agreement-path=/api/usercenter/open/ecx/agreement
espier.shopex-usercenter.docs-path=/api/usercenter/open/ecx/docs
espier.shopex-usercenter.patch-path=/api/usercenter/open/ecx/patch
espier.shopex-usercenter.download-path=/api/usercenter/open/ecx/download
espier.shopex-usercenter.secret=
