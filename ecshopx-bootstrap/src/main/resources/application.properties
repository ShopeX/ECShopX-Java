ecshopx.wechat.wxa-template-fallback.yykweishop.tag=\u7535\u5546
ecshopx.wechat.wxa-template-fallback.yykweishop.domain={"requestdomain":["https://servicewechat.com"],"wsrequestdomain":["wss://servicewechat.com"],"uploaddomain":[],"downloaddomain":[],"udpdomain":[],"tcpdomain":[]}
# ext_json.plugins[\"live-player-plugin\"]（公司开启直播时写入）
