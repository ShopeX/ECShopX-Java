# item_start_num write path: LEGACY treats numeric 0 as matching the literal "false" string; MODERN does not (default).
ecshopx.companys.item-start-num.weak-string-equals-mode=MODERN
# License gateway (override in application-local / env). Empty URL yields controlled failure at call time.
license.gateway.license-url=
license.gateway.independent-license-url=
# Product identifier for SaaS license requests (request body) and for the independent license form product field.
license.gateway.product-name=
# Product name value used only on the independent license form; not applied to SaaS license calls.
license.gateway.independent-product-type=
license.gateway.version=
license.gateway.independent-shop-url=http://localhost
