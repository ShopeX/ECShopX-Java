worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 管理后台 + API 代理
    server {
        listen 80;
        server_name ${ADMIN_HOST};

        location /api/ {
            set $java_upstream http://127.0.0.1:18080;
            proxy_pass $java_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 64m;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header Access-Control-Allow-Headers "Content-Type, Access-Control-Allow-Headers, Authorization, X-Requested-With" always;
            add_header Access-Control-Expose-Headers "Authorization" always;
            add_header Access-Control-Allow-Methods "DELETE, GET, HEAD, POST, PUT, OPTIONS, TRACE, PATCH" always;
        }

        location /storage/ {
            set $java_upstream http://127.0.0.1:18080;
            proxy_pass $java_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 64m;
        }

        location /wechatAuth/ {
            set $java_upstream http://127.0.0.1:18080;
            proxy_pass $java_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 64m;
        }

        location / {
            root /data/httpd/ECShopX-Java_Admin/dist/;
            index index.html index.htm;
            try_files $uri $uri/index.html $uri/ /index.html =404;
        }

        location ~* \.(ini|sql|conf|bak)$ {
            return 404;
        }

        location ~ /\.(svn|git|)/ {
            deny all;
        }
    }

    # H5 前端服务
    server {
        listen 80;
        server_name ${H5_HOST};

        location / {
            root /data/httpd/ECShopX-Java_Mobile/dist/h5;
            index index.html index.htm;
            try_files $uri $uri/ /index.html =404;
        }

        location ~* \.(ini|sql|conf|bak)$ {
            return 404;
        }

        location ~ /\.(svn|git|)/ {
            deny all;
        }
    }

    # PC 前端服务代理（Nuxt）
    server {
        listen 80;
        server_name ${PC_HOST};

        location / {
            set $web_frontend http://127.0.0.1:3000;
            proxy_pass $web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location ~* \.(ini|sql|conf|bak)$ {
            return 404;
        }

        location ~ /\.(svn|git|)/ {
            deny all;
        }
    }
}
