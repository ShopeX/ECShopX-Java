# 本地商品搜索 ES（单节点 + IK），对接 ecshopx.search.es.hosts=http://127.0.0.1:9200
#
# 使用：
#   cd docker/elasticsearch
#   docker compose up -d --build
#   curl http://127.0.0.1:9200
#
# 停止：
#   docker compose down

name: ecshopx-es

services:
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecshopx/elasticsearch-ik:8.15.5
    container_name: ecshopx-dev-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
      - "${ES_TRANSPORT_HOST_PORT:-9300}:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - ecshopx-es

volumes:
  es-data:

networks:
  ecshopx-es:
    name: ecshopx-es
